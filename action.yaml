---
name: "qualify-build-action"
description: "Analyses the job and makes decisions about what kind of build to run."
inputs:
  feature_branch_version_regex:
    description: "Regex to match feature branch versions."
    required: false
    default: ^[0-9]+(\.[0-9]+){2}(-[[:alnum:]]+){2}(-.+)?$
  changelog_dir:
    description: >-
      Directory holding per-pull-request changelog files. A `feature-build:` key in the
      frontmatter of the single file there marks the branch as a feature build.
    required: false
    default: .changelog
  validate_against_base:
    description: >-
      Whether a pull request must introduce exactly one new changelog version.
      Set false where the changelog is composed after merge and pull requests do not touch it.
    required: false
    default: "true"
  workflow_name:
    description: "Name of a workflow that protected branches are to be validated against."
    required: false
    default: context:validate-release
outputs:
  kind:
    description: "Build kind to run: publish when the action should produce a published artifact, otherwise test."
    value: ${{ steps.define-build.outputs.kind }}
  tag:
    description: "Tag to publish. Set for publish builds; omitted for test builds."
    value: ${{ steps.define-build.outputs.tag }}
  target:
    description: "Target of the build: feature or release."
    value: ${{ steps.define-target.outputs.target }}
  trigger:
    description: "Build trigger classification: <event>_to_<target>_branch, where <event> is one of merge_group, pull_request or push, and <target> is one of feature or release."
    value: ${{ steps.qualify-build.outputs.trigger }}
  version:
    description: "Version to publish. Set for publish builds; omitted for test builds."
    value: ${{ steps.define-build.outputs.version }}
runs:
  using: "composite"
  steps:
    - id: define-target
      name: "Is a release or a feature version needed?"
      shell: bash
      env:
        GH_TOKEN: ${{ env.GH_TOKEN || github.token }}
      run: |
        [ "${{ runner.debug }}" == 1 ] && set -xv
        set -u
        
        # A merge_group event runs on a temporary gh-readonly-queue/... ref, so ref_name names the
        # queue branch rather than the branch being merged into. The payload carries the real
        # destination as a full ref; strip refs/heads/ so all three events name a branch the same way.
        branch="${{ github.event.merge_group.base_ref || github.base_ref || github.ref_name }}"
        branch="${branch#refs/heads/}"

        if
            gh ruleset check --repo "${{ github.repository }}" "${branch}" \
              | grep -q '${{ inputs.workflow_name}}' ;
        then
            target=release
        else
            target=feature
        fi
        echo "::notice::target is ${target}"
        echo "target=${target}" >>"${GITHUB_OUTPUT}"
    - id: qualify-build
      name: "Qualify build type"
      shell: bash
      run: |
        [ "${{ runner.debug }}" == 1 ] && set -xv
        set -u
        
        case "${{ github.event_name }}" in
        merge_group|pull_request|push)
          trigger=${{ github.event_name }}_to_${{ steps.define-target.outputs.target }}_branch
          ;;
        *)
          echo "::error::Unsupported event: ${{ github.event_name }}"
          exit 1
          ;;
        esac
        
        echo "::notice::trigger is ${trigger}"
        echo "trigger=${trigger}" >>"${GITHUB_OUTPUT}"
    - id: clq-extract
      name: "Extract tag from the changelog"
      uses: denisa/clq-action@v1
      with:
        changeMap: .github/clq/changemap.json
        mode: ${{ steps.define-target.outputs.target }}
        validateAgainstBase: ${{ inputs.validate_against_base }}
    - id: feature-marker
      name: "Is this branch marked as a feature build?"
      shell: bash
      run: |
        [ "${{ runner.debug }}" == 1 ] && set -xv
        set -u

        # Where a repository composes its changelog after merge, the version in
        # CHANGELOG.md no longer carries a feature suffix — there is nothing to
        # read it from. The marker moves to the pull request's own changelog
        # file, where the author is already writing.
        readonly dir="${{ inputs.changelog_dir }}"
        marker=''

        if [ -d "${dir}" ]; then
          mapfile -t files < <(find "${dir}" -maxdepth 1 -name '*.md' ! -name 'README.md' | sort)
          if [ "${#files[@]}" -gt 1 ]; then
            echo "::error::${dir} holds ${#files[@]} files; a branch carries at most one"
            exit 1
          fi
          if [ "${#files[@]}" -eq 1 ] && [ "$(head -n1 "${files[0]}")" == "---" ]; then
            marker="$(sed -n '2,/^---$/p' "${files[0]}" |
              sed -nE 's|^feature-build:[[:space:]]*"?([^"[:space:]]+)"?[[:space:]]*$|\1|p' |
              head -n1)"
          fi
        fi

        if [ -n "${marker}" ]; then
          echo "::notice::feature build marked as ${marker}"
        fi
        echo "marker=${marker}" >>"${GITHUB_OUTPUT}"
    - id: define-build
      name: "Is this a test or publish build"
      shell: bash
      run: |
        [ "${{ runner.debug }}" == 1 ] && set -xv
        set -u
        
        readonly marker="${{ steps.feature-marker.outputs.marker }}"

        # Two ways a branch can be a feature build. The version suffix is the
        # original, and still right where the author edits CHANGELOG.md. The
        # marker is for repositories that compose it after merge, where the
        # version carries no suffix to find.
        readonly feature_version="${marker:+${{ steps.clq-extract.outputs.version }}-${marker}}"

        function is_feature_branch_version() {
          # major.minor.patch-user-issue
          # user and issue relaxed to be any alphanumeric sequence
          if [[ "${feature_version:-${{ steps.clq-extract.outputs.version }}}" =~ ${{ inputs.feature_branch_version_regex }} ]]; then
            return 0
          fi
          return 1
        }

        function is_publishable_feature_branch() {
          if ( [ "${{ github.event_name }}" == "push" ] && is_feature_branch_version ); then
            return 0
          fi
          return 1
        }
        
        if [ "${{ steps.define-target.outputs.target }}" == "release" ] \
            && [ "${{ steps.clq-extract.outputs.status }}" != "released" ]; then
          echo "::error::${{ steps.clq-extract.outputs.version }} is not a valid version for a release branch"
          {
            echo "# Version Validation Error"
            echo "Release branches, or a pull request targeting them, must have a release version."
            echo "${{ steps.clq-extract.outputs.version }} is not valid for release branches"
          } >>"${GITHUB_STEP_SUMMARY}"
          exit 1
        fi
        
        if [ "${{ steps.qualify-build.outputs.trigger }}" == "push_to_release_branch" ]; then
          kind=publish
          version="${{ steps.clq-extract.outputs.version }}"
        elif is_publishable_feature_branch; then
          kind=publish
          version="${feature_version:-${{ steps.clq-extract.outputs.version }}}-${{ github.run_id }}.${{ github.run_number }}.${{ github.run_attempt }}"
        else
          kind=test
        fi
        echo "::notice::kind is ${kind}"
        echo "kind=${kind}" >>"${GITHUB_OUTPUT}"
        echo "::notice::version is ${version:-undefined}"
        if [ -v version ]; then
          echo "version=${version}" >>"${GITHUB_OUTPUT}";
          echo "tag=v${version}" >>"${GITHUB_OUTPUT}";
        fi
